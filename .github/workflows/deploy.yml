name: Build & Verify (Render Auto-Deploys)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the JAR — verifies the project compiles cleanly
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. (Optional) Run tests when you add them
      # - name: Run Tests
      #   run: ./mvnw test

      - name: Build successful ✅
        run: echo "JAR built successfully. Render will auto-deploy from this push."
