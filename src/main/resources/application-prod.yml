# Production profile — activated with: java -jar app.jar --spring.profiles.active=prod
# All sensitive values come from environment variables set on the AWS server

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false   # hide SQL logs in production

  flyway:
    enabled: false

app:
  cors:
    # Allow the Expo Go / built APK origins in production
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.tasktracker: INFO
    org.springframework.security: WARN
