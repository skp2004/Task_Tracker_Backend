# Production profile — activated with: java -jar app.jar --spring.profiles.active=prod
# All sensitive values come from environment variables set on the AWS server

server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false   # hide SQL logs in production

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # CORS — origins are configured in application.yml (read by SecurityConfig)
  # Override via CORS_ALLOWED_ORIGINS env var if needed

logging:
  level:
    com.tasktracker: INFO
    org.springframework.security: WARN
