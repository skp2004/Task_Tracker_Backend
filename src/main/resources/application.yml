server:
  # Render injects $PORT at runtime via -Dserver.port=$PORT in startCommand.
  # Default 10000 matches Render's internal port; 8081 used locally.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: tasktracker

  # Database — Supabase PostgreSQL Session Pooler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      pool-name: TaskTrackerPool

  # JPA / Hibernate — Auto-creates tt_users & tt_tasks on startup if missing
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway: enabled with baseline so existing tables/data are not re-created,
  # only the missing indexes from V1__task_tracker_schema.sql are applied.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT & CORS
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    # Comma-separated origins — read by SecurityConfig.corsConfigurationSource()
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}

# Logging
logging:
  level:
    com.tasktracker: DEBUG
    org.springframework.security: WARN
