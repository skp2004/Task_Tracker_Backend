server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: tasktracker

  # Database — Supabase PostgreSQL Session Pooler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      pool-name: TaskTrackerPool

  # JPA / Hibernate — Auto-creates tt_users & tt_tasks on startup if missing
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway disabled to avoid baseline history table conflicts in Supabase
  flyway:
    enabled: false

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT & CORS
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}

# Logging
logging:
  level:
    com.tasktracker: DEBUG
    org.springframework.security: WARN
