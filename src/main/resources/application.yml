server:
  # Render injects $PORT at runtime via -Dserver.port=$PORT in startCommand.
  port: ${SERVER_PORT:8081}
  # Enable Java 21 Virtual Thread executor for Tomcat — replaces platform threads
  # with lightweight virtual threads (Project Loom). Each HTTP request gets its own
  # virtual thread; no thread pool saturation under concurrent load.
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: tasktracker

  # ── Java 21 Virtual Threads (Project Loom) ──────────────────────────────────
  # Spring Boot 3.2+ activates virtual threads for Tomcat, @Async, and
  # scheduled tasks with a single property. Zero platform thread pool blocking.
  threads:
    virtual:
      enabled: true

  # Database — Supabase PostgreSQL Session Pooler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase session pooler cap is 15 connections; keep maximum-pool-size low (4)
      # so Render zero-downtime deploys (old container + new container) never exceed 15 connections.
      # Virtual threads park instead of blocking, so 4 DB connections comfortably serve
      # hundreds of concurrent requests.
      maximum-pool-size: 4
      minimum-idle: 1
      initialization-fail-timeout: 30000 # 30s retry window if pooler is temporarily busy during deploy
      connection-timeout: 20000       # 20 s: fail fast rather than queue forever
      idle-timeout: 300000            # 5 min: release idle connections promptly
      max-lifetime: 1800000           # 30 min: rotate before Supabase kills them
      keepalive-time: 60000           # 1 min: keep connections alive through NAT
      pool-name: TaskTrackerPool
      # Validate connection before handing to thread (prevents stale conn errors)
      connection-test-query: SELECT 1

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false           # Never hold a DB connection across entire HTTP request
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25            # Batch inserts/updates — reduces round trips by 25x
          fetch_size: 50            # Stream 50 rows per round trip instead of all-at-once
        order_inserts: true         # Group INSERTs by type for maximum batch efficiency
        order_updates: true         # Group UPDATEs for maximum batch efficiency
        generate_statistics: false  # Disable in dev; enable only for profiling

  # Flyway: enabled with baseline so existing tables/data are not re-created,
  # only the missing indexes from V1__task_tracker_schema.sql are applied.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true
    validate-on-migrate: false

  # SMTP Mail (Gmail)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:shashwatpatel04@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:mizk akis efqm czxg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT & CORS
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    # Comma-separated origins — read by SecurityConfig.corsConfigurationSource()
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}

# Logging
logging:
  level:
    com.tasktracker: DEBUG
    org.springframework.security: WARN
